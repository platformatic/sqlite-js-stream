name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: test (node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # sqlite-js-stream requires Node >= 24 for native type stripping + node:sqlite.
        # 24 = current LTS, 26 = next LTS.
        node-version: [24, 26]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck:all

      - name: Lint (ESLint + neostandard, type-stripping guard)
        run: pnpm lint

      - name: Run tests
        run: pnpm test:all

  interop-go:
    name: go-interop goldens (regenerate + verify)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.24.x'
          cache: true
          cache-dependency-path: tools/golden/go.sum

      - name: Generate Go LTX goldens
        run: cd tools/golden && go run .

      - name: Verify goldens are up to date
        run: git diff --exit-code -- testdata/go

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install Node deps
        run: pnpm install --frozen-lockfile

      - name: Decode Go LTX files with the TS decoder
        run: node --test test/ltx/go-interop.test.ts
