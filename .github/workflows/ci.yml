name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: test (node ${{ matrix.node-version }})
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # sqlite-js-stream requires Node >= 24 for native type stripping + node:sqlite.
        # 24 = current LTS, 26 = next LTS.
        node-version: [24, 26]
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PG_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck:all

      - name: Lint (ESLint + neostandard, type-stripping guard)
        run: pnpm lint

      - name: Run tests
        run: pnpm test:all

  paged-vfs:
    name: paged-vfs (${{ matrix.os }}, node ${{ matrix.node-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, macos-latest]
        node-version: [24, 26]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/paged-vfs

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check Rust formatting and lints
        working-directory: packages/paged-vfs
        run: cargo fmt --check && cargo clippy --release -- -D warnings

      - name: Build and test
        run: pnpm test:paged-vfs

  interop-go:
    name: go-interop goldens (regenerate + verify)
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.27.x'
          cache: true
          cache-dependency-path: tools/golden/go.sum

      - name: Generate Go LTX goldens
        run: cd tools/golden && go run .

      - name: Verify goldens are up to date
        run: git diff --exit-code -- testdata/go

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm

      - name: Install Node deps
        run: pnpm install --frozen-lockfile

      - name: Decode Go LTX files with the TS decoder
        run: node --test test/ltx/go-interop.test.ts
